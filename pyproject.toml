[project]
name = "ocr-benchmark"
version = "0.1.0"
description = "Compare text extraction from PDFs / images / tables across popular OCR & document parsing tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Vivek Pol" }]

dependencies = [
    # UI
    "streamlit>=1.36",
    # Common
    "numpy>=1.26,<2.0",
    "pillow>=10.0,<11",
    "httpx>=0.27,<1",
    "opencv-python>=4.9",
    "pandas>=2.0",
    "pdf2image>=1.17",
    "pymupdf>=1.24",
    # OCR / document tools
    "paddleocr>=2.7",
    # Install exactly one PaddlePaddle runtime.  The Windows RTX 50-series GPU
    # wheel is installed separately (see README / setup instructions); keeping
    # the CPU distribution here makes uv install both packages into the same
    # `paddle` namespace and corrupts the installation.
    "surya-ocr>=0.6",
    "python-doctr>=0.9",
    "pytesseract>=0.3.10",
    "easyocr>=1.7",
    "pdfplumber>=0.11",
    "camelot-py>=0.11",
    "docling>=1.7",
    "marker-pdf>=0.2",
    # Torch (installed separately for CUDA if needed)
    "torch>=2.2",
    "torchvision>=0.17",
]

[tool.uv]
# uv-specific config; keep index defaults
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engines"]
